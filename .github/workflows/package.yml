name: Package

# Builds the relocatable Linux binary package (opt/package.sh), smoke-tests it
# on clean distributions without LLVM, and attaches it to a GitHub release when
# a `v*` tag is pushed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The package runs on glibc >= the build host's: build on the oldest
    # supported Ubuntu.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo apt update
        sudo apt install -y clang-20 libclang-cpp20-dev g++ clang-tools-20 libclang-20-dev patchelf

    - name: Install Rust
      run: rustup update stable && rustup default stable

    - name: Install F*
      run: ./opt/install-fstar.sh --link-dir /usr/local/bin

    - name: Build package
      run: make package PACKAGE_OPTS=--check-pulse

    - name: Test package (translate and verify)
      run: VERIFY=1 make package-test

    - uses: actions/upload-artifact@v4
      with:
        name: pal-linux-x86_64
        path: dist/pal-*.tar.gz*

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12']
    container: ${{ matrix.image }}
    steps:
    - name: Install test prerequisites (no LLVM)
      run: apt-get update && apt-get install -y make libc6-dev

    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: pal-linux-x86_64
        path: dist

    - name: Test package (translate)
      run: VERIFY=0 make package-test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: pal-linux-x86_64
        path: dist

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
