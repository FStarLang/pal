name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  main:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v3

    - name: Install clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt update
        sudo apt install -y clang-23 llvm-23-dev libclang-cpp23-dev g++ clang-tools-23 libclang-23-dev clang-format-23

    - name: Install F*
      run: ./opt/install-fstar.sh --link-dir /usr/local/bin

    - name: Build pal
      run: |
        make -j$(nproc)

    - name: Test pal
      run: |
        make -j$(nproc) test
