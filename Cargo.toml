[package]
name = "pal"
version = "0.1.0"
edition = "2024"
default-run = "pal"

[dependencies]
chumsky = "0.13.0"
clap = { version = "4.6.1", features = ["derive"] }
codespan-reporting = "0.13.1"
lsp-types = "0.97.0"
num-bigint = "0.4"
pretty = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c = "0.24"

[build-dependencies]
build-rs = "0.3.4"
cc = "1.2.63"
zngur = "0.10.0"
